[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pytools"
version = "0.1.0"
description = "Tiny, professional Python tools — one file per problem, stdlib-first."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Ali Naqi" }]
keywords = ["cli", "tools", "stdlib", "scripts", "utilities"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]
docs = [
    "mkdocs-material>=9.5",
]

[project.scripts]
# dev
pytools-port-kill      = "pytools.dev.port_kill:main"
pytools-git-churn      = "pytools.dev.git_churn:main"
pytools-dead-imports   = "pytools.dev.dead_imports:main"
pytools-env-lint       = "pytools.dev.env_lint:main"
pytools-todo-grep      = "pytools.dev.todo_grep:main"
# files
pytools-dedupe         = "pytools.files.dedupe:main"
pytools-atomic-write   = "pytools.files.atomic_write:main"
pytools-find-content   = "pytools.files.find_by_content:main"
pytools-normalize-eol  = "pytools.files.normalize_eol:main"
pytools-safe-rename    = "pytools.files.safe_rename:main"
# data
pytools-json-repair    = "pytools.data.json_repair:main"
pytools-jq-lite        = "pytools.data.jq_lite:main"
pytools-csv-to-jsonl   = "pytools.data.csv_to_jsonl:main"
pytools-schema-diff    = "pytools.data.schema_diff:main"
pytools-frequencies    = "pytools.data.frequencies:main"
# web
pytools-http-retry     = "pytools.web.http_retry:main"
pytools-sse-parse      = "pytools.web.sse_parse:main"
pytools-sitemap-crawl  = "pytools.web.sitemap_crawl:main"
pytools-headers-check  = "pytools.web.headers_check:main"
pytools-url-status     = "pytools.web.url_status:main"

[project.urls]
Homepage      = "https://github.com/naqi10/pytools"
Documentation = "https://naqi10.github.io/pytools/"
Issues        = "https://github.com/naqi10/pytools/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pytools"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "PL", "C4", "PTH"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]
